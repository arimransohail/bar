name: Build Haier Remote APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct source
        run: |
          cat haier_remote_build/parts/0[0-7] > /tmp/haier_source.b64
          base64 -d /tmp/haier_source.b64 > /tmp/haier_source.zip
          unzip -t /tmp/haier_source.zip
          mkdir -p /tmp/haier
          unzip -q /tmp/haier_source.zip -d /tmp/haier

      - name: Build installable debug APK
        run: |
          cd /tmp/haier/haier_43s81_remote_v0_3
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage APK
        run: |
          cp /tmp/haier/haier_43s81_remote_v0_3/app/build/outputs/apk/debug/app-debug.apk Haier-43S81-Remote-v0.3-installable.apk
          ls -lh Haier-43S81-Remote-v0.3-installable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haier-43S81-Remote-APK
          path: Haier-43S81-Remote-v0.3-installable.apk
          if-no-files-found: error
